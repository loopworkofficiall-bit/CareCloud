# Netlify build config.
#
# Vercel was the original target, but github.com and vercel.com are both
# unreachable from the build network this project was developed on. Netlify
# is reachable, free, and runs the Next.js App Router natively -- the runtime
# plugin maps route handlers to functions, so /api/* keeps working unchanged.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
